<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bablu AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08080c;
      color: white;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      text-align: center;
      background: #0d0d12;
      border-bottom: 1px solid #292932;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    .welcome {
      text-align: center;
      padding: 25px 10px;
    }

    .robot {
      font-size: 58px;
    }

    .welcome h2 {
      margin-top: 10px;
      font-size: 25px;
    }

    .welcome p {
      color: #999;
      margin-top: 7px;
      font-size: 14px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .tool {
      background: #15151c;
      border: 1px solid #292932;
      border-radius: 15px;
      padding: 15px 7px;
      color: white;
      cursor: pointer;
      text-align: center;
      transition: .2s;
    }

    .tool:active {
      transform: scale(.96);
    }

    .tool .icon {
      font-size: 27px;
    }

    .tool h3 {
      font-size: 13px;
      margin-top: 6px;
    }

    .chat {
      margin-top: 18px;
      background: #101016;
      border: 1px solid #292932;
      border-radius: 18px;
      overflow: hidden;
    }

    .chat-header {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292932;
    }

    .chat-title {
      font-weight: bold;
    }

    #clearBtn {
      background: transparent;
      color: #999;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 9px;
      cursor: pointer;
    }

    #messages {
      height: 380px;
      overflow-y: auto;
      padding: 14px;
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message {
      max-width: 82%;
      padding: 11px 13px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .message {
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 4px;
    }

    .ai .message {
      background: #1d1d26;
      color: white;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #292932;
      background: #0d0d12;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border-radius: 13px;
      border: 1px solid #33333d;
      background: #15151c;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #777;
    }

    #sendBtn {
      padding: 13px 16px;
      border: none;
      border-radius: 13px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: .5;
    }

    .typing {
      color: #999;
      font-style: italic;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 25px;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .tools {
        grid-template-columns: repeat(2, 1fr);
      }

      #messages {
        height: 350px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 Bablu AI</h1>
    <p>Your AI Assistant</p>
  </header>

  <main class="container">

    <section class="welcome">
      <div class="robot">🤖</div>
      <h2>Welcome to Bablu AI</h2>
      <p>Ask anything. Learn, create and explore.</p>
    </section>

    <section class="tools">

      <button class="tool" onclick="selectTool('Chat')">
        <div class="icon">💬</div>
        <h3>AI Chat</h3>
      </button>

      <button class="tool" onclick="selectTool('Image')">
        <div class="icon">🖼️</div>
        <h3>AI Image</h3>
      </button>

      <button class="tool" onclick="selectTool('Video')">
        <div class="icon">🎬</div>
        <h3>AI Video</h3>
      </button>

      <button class="tool" onclick="selectTool('Voice')">
        <div class="icon">🎤</div>
        <h3>AI Voice</h3>
      </button>

      <button class="tool" onclick="selectTool('Study')">
        <div class="icon">📚</div>
        <h3>AI Study</h3>
      </button>

      <button class="tool" onclick="selectTool('Writer')">
        <div class="icon">✍️</div>
        <h3>AI Writer</h3>
      </button>

    </section>

    <section class="chat">

      <div class="chat-header">
        <div class="chat-title">💬 Bablu AI Chat</div>
        <button id="clearBtn" onclick="clearChat()">Clear</button>
      </div>

      <div id="messages"></div>

      <div class="input-area">

        <input
          id="messageInput"
          type="text"
          placeholder="Ask Bablu AI anything..."
          autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">
          Send
        </button>

      </div>

    </section>

  </main>

  <footer>
    Bablu AI • V2
  </footer>

  <script>

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let chatHistory =
      JSON.parse(localStorage.getItem("bablu_ai_history") || "[]");

    // केवल आखिरी 20 messages रखो
    chatHistory = chatHistory.slice(-20);

    function saveHistory() {

      // हर बार केवल आखिरी 20 messages save होंगे
      chatHistory = chatHistory.slice(-20);

      localStorage.setItem(
        "bablu_ai_history",
        JSON.stringify(chatHistory)
      );
    }

    function addMessage(text, type, save = true) {

      const row = document.createElement("div");
      row.className = "message-row " + type;

      const bubble = document.createElement("div");
      bubble.className = "message";

      bubble.textContent = text;

      row.appendChild(bubble);
      messages.appendChild(row);

      messages.scrollTop = messages.scrollHeight;

      if (save) {

        chatHistory.push({
          text: text,
          type: type
        });

        // 20 से ज्यादा होने पर सबसे पुराने messages हटेंगे
        chatHistory = chatHistory.slice(-20);

        saveHistory();
      }

      return row;
    }

    function loadHistory() {

      chatHistory = chatHistory.slice(-20);

      if (chatHistory.length === 0) {

        addMessage(
          "Hello! I'm Bablu AI. 🤖\nHow can I help you today?",
          "ai"
        );

        return;
      }

      chatHistory.forEach(item => {
        addMessage(item.text, item.type, false);
      });
    }

    function clearChat() {

      if (!confirm("Clear your chat history?")) {
        return;
      }

      chatHistory = [];

      localStorage.removeItem("bablu_ai_history");

      messages.innerHTML = "";

      addMessage(
        "Chat cleared! 🤖\nI'm ready for your next question.",
        "ai"
      );
    }

    function selectTool(tool) {

      addMessage(
        tool + " selected. 🚀\nThis feature will be upgraded in future versions.",
        "ai"
      );
    }

    async function sendMessage() {

      const text = input.value.trim();

      if (!text) {
        return;
      }

      addMessage(text, "user");

      input.value = "";

      sendBtn.disabled = true;

      const loading = addMessage(
        "🤖 सोच रहा हूँ...",
        "ai"
      );

      loading.querySelector(".message").classList.add("typing");

      try {

        const response = await fetch("/api", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        loading.remove();

        addMessage(
          data.reply || "कोई जवाब नहीं मिला।",
          "ai"
        );

      } catch (error) {

        loading.remove();

        addMessage(
          "❌ Server से connection नहीं हो पाया।",
          "ai"
        );
      }

      sendBtn.disabled = false;

      input.focus();
    }

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

    loadHistory();

  </script>

</body>
  </html>
