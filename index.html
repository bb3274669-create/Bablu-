<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bablu AI</title>
<script src="https://js.puter.com/v2/"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#08080c;color:white;font-family:Arial}
header{text-align:center;padding:18px;background:#11111a}
.container{max-width:800px;margin:auto;padding:15px}
button,input{border:0;border-radius:12px;padding:13px}
button{background:#202040;color:white;cursor:pointer}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jarvis{grid-column:1/3;background:#303080}
.chat{height:55vh;overflow:auto;margin:12px 0}
.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#3030a0;margin-left:15%}
.ai{background:#191922;margin-right:15%}
img{max-width:100%;border-radius:12px}
.row{display:flex;gap:8px}
input{flex:1;background:#15151e;color:white}
.status{text-align:center;color:#aaa;padding:8px}
</style>
</head>

<body>

<header>
<h1>🤖 Bablu AI</h1>
<p>Personal AI Assistant ✨</p>
</header>

<div class="container">

<div class="tools">

<button onclick="focusChat()">💬 AI Chat</button>
<button onclick="image()">🖼️ AI Image</button>
<button onclick="video()">🎬 AI Video</button>
<button onclick="study()">📚 Study</button>
<button onclick="writer()">✍️ Writer</button>
<button onclick="voice()">🎤 Voice</button>

<button class="jarvis" id="jb" onclick="jarvis()">
🤖 JARVIS: <span id="js">OFF</span>
</button>

</div>

<div class="status" id="status">Ready ✨</div>
<div class="chat" id="chat"></div>

<div class="row">
<input id="msg" placeholder="Message Bablu AI...">
<button onclick="send()">➤</button>
</div>

<div class="row" style="margin-top:8px">
<button onclick="voice()">🎤 Voice</button>
<button onclick="stop()">🔇 Stop</button>
<button onclick="clearChat()">🗑️ Clear</button>
</div>

</div>

<script>

/* HISTORY */

let history=JSON.parse(
localStorage.getItem("bablu_ai_history")||"[]"
);

let on=false,rec=null,busy=false;

const msg=document.getElementById("msg");
const chat=document.getElementById("chat");
const status=document.getElementById("status");

function save(){
localStorage.setItem(
"bablu_ai_history",JSON.stringify(history)
);
}

function add(text,type="ai"){

let d=document.createElement("div");
d.className="msg "+type;
d.textContent=text;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;

}

function load(){

history.forEach(x=>{
if(x.type=="image"){
let d=document.createElement("div");
d.className="msg ai";
let i=document.createElement("img");
i.src=x.src;
d.appendChild(i);
chat.appendChild(d);
}else add(x.text,x.role=="user"?"user":"ai");
});

}

load();


/* CHAT */

async function sendText(text,jar=false){

if(!text)return;

add(text,"user");

history.push({role:"user",text});
save();

status.textContent=jar?"🤖 JARVIS thinking...":"🧠 Thinking...";

try{

let r=await fetch("/api",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text,mode:"chat"})
});

let d=await r.json();
let reply=d.reply||"Jawab nahi mila 😕";

add(reply,"ai");

history.push({role:"ai",text:reply});
save();

jar?speak(reply):speak(reply);

}catch(e){

add("Server se connection nahi ho paya. 😕");

}

status.textContent=on?"🤖 JARVIS ready":"Ready ✨";

}

async function send(){

let t=msg.value.trim();
msg.value="";
await sendText(t);

}

msg.onkeydown=e=>{
if(e.key=="Enter")send();
};


/* VOICE */

function voice(){

let SR=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SR){
alert("Voice supported nahi hai.");
return;
}

rec=new SR();
rec.lang="hi-IN";
rec.continuous=false;

status.textContent="🎤 Sun raha hoon...";

rec.onresult=e=>{
msg.value=e.results[0][0].transcript;
send();
};

rec.start();

}

function stop(){

if(rec)try{rec.stop()}catch(e){}
speechSynthesis.cancel();
status.textContent="Voice stopped 🔇";

}


/* SPEAK */

function speak(t){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

let u=new SpeechSynthesisUtterance(t);
u.lang="hi-IN";
u.rate=.9;

speechSynthesis.speak(u);

}


/* IMAGE */

async function image(){

let p=msg.value.trim()||
prompt("Kaisi image banani hai? 🎨");

if(!p)return;

msg.value="";
status.textContent="🎨 Image bana raha hoon...";

try{

let x=await puter.ai.txt2img(
p,{model:"gpt-image-2"}
);

let src=typeof x=="string"?x:x.src||x.url;

let d=document.createElement("div");
d.className="msg ai";

let i=document.createElement("img");
i.src=src;
d.appendChild(i);

chat.appendChild(d);

history.push({type:"image",src});
save();

status.textContent="Image ready ✅";

}catch(e){

add("Image generate nahi ho payi 😕");

}

}


/* OTHER TOOLS */

function video(){
add("🎬 AI Video feature V2 me connect kiya jayega 🚀");
}

function study(){
msg.value="Mujhe Study me help karo 📚: ";
msg.focus();
}

function writer(){
msg.value="Mujhe Writing me help karo ✍️: ";
msg.focus();
}

function focusChat(){
msg.focus();
}


/* CLEAR */

function clearChat(){

history=[];
save();
chat.innerHTML="";
add("Chat clear ho gaya 😊");

}


/* SEARCH */

function search(url,name){

window.open(url,"_blank");
status.textContent="🔎 "+name+" search opened";

}


/* JARVIS */

function jarvis(){

if(on){
on=false;
stop();
document.getElementById("js").textContent="OFF";
return;
}

on=true;
document.getElementById("js").textContent="ON";

speak("JARVIS activated. Main sun raha hoon.");

setTimeout(listen,1000);

}


function listen(){

if(!on||busy)return;

let SR=window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR)return;

rec=new SR();
rec.lang="hi-IN";
rec.continuous=false;

status.textContent="🤖 Listening... 🎤";

rec.onresult=async e=>{

let c=e.results[0][0].transcript.trim();

busy=true;

await command(c);

busy=false;

if(on)setTimeout(listen,1200);

};

rec.onerror=()=>{
busy=false;
if(on)setTimeout(listen,1500);
};

rec.start();

}


/* JARVIS COMMANDS */

async function command(c){

let t=c.toLowerCase();


/* OFF */

if(
t.includes("jarvis off")||
t.includes("जार्विस बंद")
){

on=false;
document.getElementById("js").textContent="OFF";
speak("ठीक है, JARVIS बंद कर रहा हूँ।");
return;

}


/* GOOGLE */

if(t.includes("google")){

let q=c.replace(/google/gi,"")
.replace(/par|pe|me|mein|search|karo|kar do/gi,"")
.trim();

if(q){

speak("Google par search kar raha hoon.");

search(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"Google"
);

return;
}

}


/* YOUTUBE */

if(t.includes("youtube")||t.includes("यूट्यूब")){

let q=c
.replace(/youtube/gi,"")
.replace(/यूट्यूब/g,"")
.replace(/par|pe|me|mein|search|karo|kar do/gi,"")
.replace(/पर|पे|में|सर्च|करो|कर दो/g,"")
.trim();

if(q){

speak("YouTube par search kar raha hoon.");

search(
"https://www.youtube.com/results?search_query="+
encodeURIComponent(q),
"YouTube"
);

return;
}

}


/* INSTAGRAM */

if(t.includes("instagram")||t.includes("इंस्टाग्राम")){

let q=c
.replace(/instagram/gi,"")
.replace(/इंस्टाग्राम/g,"")
.replace(/par|pe|me|mein|search|karo|kar do/gi,"")
.replace(/पर|पे|में|सर्च|करो|कर दो/g,"")
.trim();

if(q){

speak("Instagram par search kar raha hoon.");

search(
"https://www.instagram.com/explore/search/keyword/?q="+
encodeURIComponent(q),
"Instagram"
);

return;
}

}


/* FACEBOOK */

if(t.includes("facebook")||t.includes("फेसबुक")){

let q=c
.replace(/facebook/gi,"")
.replace(/फेसबुक/g,"")
.replace(/par|pe|me|mein|search|karo|kar do/gi,"")
.replace(/पर|पे|में|सर्च|करो|कर दो/g,"")
.trim();

if(q){

speak("Facebook par search kar raha hoon.");

search(
"https://www.facebook.com/search/top?q="+
encodeURIComponent(q),
"Facebook"
);

return;
}

}


/* CLEAR */

if(
t.includes("chat clear")||
t.includes("chat saaf")||
t.includes("चैट साफ")
){

clearChat();
speak("Chat साफ कर दिया।");
return;

}


/* TIME */

if(
t.includes("time")||
t.includes("समय")||
t.includes("कितने बजे")
){

let x=new Date().toLocaleTimeString(
"hi-IN",{hour:"numeric",minute:"2-digit"}
);

speak("Abhi "+x+" baj rahe hain.");
return;

}


/* DATE */

if(
t.includes("date")||
t.includes("तारीख")
){

let x=new Date().toLocaleDateString(
"hi-IN",
{day:"numeric",month:"long",year:"numeric"}
);

speak("Aaj "+x+" hai.");
return;

}


/* IMAGE */

if(
t.includes("image banao")||
t.includes("image bana")||
t.includes("photo banao")||
t.includes("तस्वीर बनाओ")||
t.includes("इमेज बनाओ")
){

let p=c
.replace(/image\s*banao?/gi,"")
.replace(/photo\s*banao/gi,"")
.replace(/तस्वीर बनाओ/g,"")
.replace(/इमेज बनाओ/g,"")
.trim();

if(!p){
speak("Kaisi image banani hai?");
return;
}

msg.value=p;
await image();
return;

}


/* NORMAL AI */

await sendText(c,true);

}

</script>

</body>
  </html>
