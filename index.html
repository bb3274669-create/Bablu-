<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bablu AI</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#08080c;
  color:white;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  background:#11111a;
  border-bottom:1px solid #29293a;
}

header h1{font-size:25px}
header p{
  color:#aaa;
  margin-top:5px;
  font-size:13px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.tool{
  background:#151520;
  color:white;
  border:1px solid #303044;
  border-radius:14px;
  padding:15px;
  text-align:left;
  cursor:pointer;
}

.tool strong{display:block;font-size:15px}
.tool small{
  display:block;
  color:#999;
  margin-top:5px;
}

.jarvis-tool{
  grid-column:1/-1;
  border-color:#5555ff;
}

.jarvis-on{
  background:#17174a;
  border-color:#7777ff;
}

.jarvis-status{
  display:none;
  text-align:center;
  background:#14142a;
  border:1px solid #4d4dff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  color:#aaaaff;
}

.chat{
  min-height:350px;
  max-height:58vh;
  overflow-y:auto;
  padding:5px;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  max-width:88%;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  margin-left:auto;
  background:#3030a0;
}

.ai{
  margin-right:auto;
  background:#191922;
  border:1px solid #292936;
}

.jarvis-message{
  border-left:3px solid #7777ff;
}

.message img{
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.bottom{
  position:sticky;
  bottom:0;
  background:#08080c;
  padding-top:10px;
}

.input-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:14px;
  border-radius:13px;
  border:1px solid #333344;
  background:#15151e;
  color:white;
  outline:none;
}

.send{
  width:52px;
  background:#4b4bff;
  color:white;
  font-size:20px;
  border:0;
  border-radius:13px;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.action-row button{
  padding:11px;
  background:#171720;
  color:white;
  border:1px solid #30303e;
  border-radius:13px;
}

.status{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:7px;
}

@media(max-width:450px){
  .tools{grid-template-columns:1fr 1fr}
  .message{max-width:94%}
}
</style>
</head>

<body>

<header>
  <h1>🤖 Bablu AI</h1>
  <p>Your Personal AI Assistant ✨</p>
</header>

<div class="container">

<div class="tools">

<button class="tool" onclick="focusChat()">
<strong>💬 AI Chat</strong>
<small>Ask anything 🌎</small>
</button>

<button class="tool" onclick="generateImage()">
<strong>🖼️ AI Image</strong>
<small>Create real images 🎨</small>
</button>

<button class="tool" onclick="videoTool()">
<strong>🎬 AI Video</strong>
<small>Video tool 🚀</small>
</button>

<button class="tool" onclick="studyTool()">
<strong>📚 Study</strong>
<small>Learn smarter 🧠</small>
</button>

<button class="tool" onclick="writerTool()">
<strong>✍️ Writer</strong>
<small>Write anything 📝</small>
</button>

<button class="tool" onclick="startVoice()">
<strong>🎤 Voice</strong>
<small>Speak naturally 🗣️</small>
</button>

<button class="tool jarvis-tool"
id="jarvisTool"
onclick="toggleJarvis()">

<strong>🤖 JARVIS MODE</strong>
<small id="jarvisSmall">
Activate your AI assistant ⚡
</small>

</button>

</div>

<div class="jarvis-status" id="jarvisStatus">
🤖 JARVIS is OFF
</div>

<div class="chat" id="chat"></div>

<div class="bottom">

<div class="status" id="status">
Ready ✨
</div>

<div class="input-row">

<input
id="message"
placeholder="Message Bablu AI... 💬"
autocomplete="off">

<button class="send" onclick="sendMessage()">➤</button>

</div>

<div class="action-row">

<button onclick="startVoice()">🎤 Voice</button>
<button onclick="stopVoice()">🔇 Stop</button>
<button onclick="clearChat()">🗑️ Clear</button>

</div>

</div>
</div>

<script>

/* =========================
   VARIABLES
========================= */

let chatHistory=
JSON.parse(
localStorage.getItem("bablu_ai_history")||"[]"
);

let jarvisMode=false;
let recognition=null;
let jarvisRecognition=null;
let jarvisBusy=false;


/* =========================
   ELEMENTS
========================= */

const messageInput=
document.getElementById("message");

const chat=
document.getElementById("chat");

const statusText=
document.getElementById("status");

const jarvisStatus=
document.getElementById("jarvisStatus");

const jarvisTool=
document.getElementById("jarvisTool");

const jarvisSmall=
document.getElementById("jarvisSmall");


/* =========================
   HISTORY
========================= */

function saveHistory(){
localStorage.setItem(
"bablu_ai_history",
JSON.stringify(chatHistory)
);
}

function addMessage(
text,
type="ai",
isJarvis=false
){

const div=document.createElement("div");

div.className=
"message "+
type+
(isJarvis?" jarvis-message":"");

div.textContent=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

return div;
}

function addImage(src){

const div=document.createElement("div");

div.className="message ai";

const img=document.createElement("img");

img.src=src;

div.appendChild(img);

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function loadHistory(){

chat.innerHTML="";

chatHistory.forEach(item=>{

if(item.type==="image"){

addImage(item.src);

}else{

addMessage(
item.text,
item.role==="user"?"user":"ai"
);

}

});

}

loadHistory();


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

chatHistory=[];

saveHistory();

chat.innerHTML="";

addMessage(
"Chat clear ho gaya 😊 Ab fresh conversation shuru karte hain.",
"ai"
);

}


/* =========================
   CHAT
========================= */

async function sendMessage(){

const text=
messageInput.value.trim();

if(!text)return;

messageInput.value="";

await sendMessageText(text,false);

}


async function sendMessageText(
text,
fromJarvis=false
){

addMessage(
text,
"user",
fromJarvis
);

chatHistory.push({
role:"user",
text:text
});

saveHistory();

statusText.textContent=
fromJarvis?
"🤖 JARVIS thinking...":
"🧠 Thinking...";

try{

const response=
await fetch("/api",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text,
mode:"chat"
})

});

const data=
await response.json();

const reply=
data.reply||
"Mujhe jawab nahi mila. 😕";

addMessage(
reply,
"ai",
fromJarvis
);

chatHistory.push({
role:"ai",
text:reply
});

saveHistory();

if(fromJarvis){

await speakJarvis(reply);

}else{

speak(reply);

}

}catch(error){

console.error(error);

addMessage(
"Server se connection nahi ho paya. 😕",
"ai",
fromJarvis
);

}

statusText.textContent=
jarvisMode?
"🤖 JARVIS ready":
"Ready ✨";

}


/* =========================
   ENTER
========================= */

messageInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
sendMessage();
}

});


/* =========================
   NORMAL VOICE INPUT
========================= */

function startVoice(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){

alert(
"Is browser me Voice Input supported nahi hai."
);

return;
}

recognition=new SR();

recognition.lang="hi-IN";
recognition.continuous=false;
recognition.interimResults=false;

statusText.textContent=
"🎤 Sun raha hoon...";

try{
recognition.start();
}catch(e){
return;
}

recognition.onresult=
function(event){

const text=
event.results[0][0].transcript;

messageInput.value=text;

sendMessage();

};

recognition.onerror=
function(){

statusText.textContent=
"Voice error 😕";

};

recognition.onend=
function(){

if(!jarvisMode)
statusText.textContent="Ready ✨";

};

}


function stopVoice(){

if(recognition){

try{
recognition.stop();
}catch(e){}

}

if(jarvisRecognition){

try{
jarvisRecognition.stop();
}catch(e){}

}

speechSynthesis.cancel();

statusText.textContent=
"Voice stopped 🔇";

}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

if(!("speechSynthesis" in window))
return;

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="hi-IN";
u.rate=0.95;
u.volume=1;
u.pitch=1;

speechSynthesis.speak(u);

}


/* =========================
   IMAGE
========================= */

async function generateImage(){

let prompt=
messageInput.value.trim();

if(!prompt){

prompt=
window.prompt(
"Kaisi image banani hai? 🎨"
);

}

if(!prompt)return;

messageInput.value="";

addMessage(
"🖼️ Image generate kar raha hoon... 🎨",
"ai"
);

statusText.textContent=
"🎨 Creating image...";

try{

const generatedImage=
await puter.ai.txt2img(
prompt,
{
model:"gpt-image-2"
}
);

let src="";

if(typeof generatedImage==="string"){

src=generatedImage;

}else if(
generatedImage&&
generatedImage.src
){

src=generatedImage.src;

}else if(
generatedImage&&
generatedImage.url
){

src=generatedImage.url;

}else{

src=generatedImage;

}

addImage(src);

chatHistory.push({
type:"image",
src:src
});

saveHistory();

statusText.textContent=
"Image ready ✅";

}catch(error){

console.error(error);

addMessage(
"Image generate nahi ho payi. 😕 Dobara try karo.",
"ai"
);

statusText.textContent=
"Image error";

}

}


/* =========================
   OTHER TOOLS
========================= */

function videoTool(){

addMessage(
"🎬 AI Video feature V2 me connect kiya jayega. Video tool ready hai 🚀",
"ai"
);

}

function studyTool(){

messageInput.value=
"Mujhe study me help karo 📚: ";

messageInput.focus();

}

function writerTool(){

messageInput.value=
"Mujhe writing me help karo ✍️: ";

messageInput.focus();

}

function focusChat(){

messageInput.focus();

}


/* =========================
   JARVIS ON/OFF
========================= */

async function toggleJarvis(){

if(jarvisMode){

stopJarvis();

return;

}

jarvisMode=true;

jarvisTool.classList.add("jarvis-on");

jarvisSmall.textContent=
"JARVIS is active ⚡";

jarvisStatus.style.display="block";

jarvisStatus.textContent=
"🤖 JARVIS activating...";

await speakJarvis(
"JARVIS activated."
);

if(jarvisMode){

jarvisStatus.textContent=
"🤖 JARVIS is listening... 🎤";

setTimeout(
startJarvisListening,
500
);

}

}


/* =========================
   STOP JARVIS
========================= */

function stopJarvis(){

jarvisMode=false;
jarvisBusy=false;

if(jarvisRecognition){

try{
jarvisRecognition.stop();
}catch(e){}

jarvisRecognition=null;

}

speechSynthesis.cancel();

jarvisTool.classList.remove(
"jarvis-on"
);

jarvisSmall.textContent=
"Activate your AI assistant ⚡";

jarvisStatus.style.display="block";

jarvisStatus.textContent=
"🤖 JARVIS is OFF";

}


/* =========================
   JARVIS LISTENING
========================= */

function startJarvisListening(){

if(!jarvisMode||
jarvisBusy)return;

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){

jarvisStatus.textContent=
"🎤 Voice recognition supported nahi hai.";

return;

}

jarvisRecognition=
new SR();

jarvisRecognition.lang="hi-IN";

jarvisRecognition.continuous=false;

jarvisRecognition.interimResults=false;

jarvisStatus.textContent=
"🤖 Listening... 🎤";

try{

jarvisRecognition.start();

}catch(e){

setTimeout(
startJarvisListening,
1000
);

return;

}

jarvisRecognition.onresult=
async function(event){

const command=
event.results[0][0]
.transcript
.trim();

if(!command)return;

jarvisBusy=true;

await handleJarvisCommand(command);

jarvisBusy=false;

if(jarvisMode){

setTimeout(
startJarvisListening,
1000
);

}

};

jarvisRecognition.onerror=
function(){

jarvisBusy=false;

if(jarvisMode){

setTimeout(
startJarvisListening,
1200
);

}

};

}


/* =========================
   JARVIS COMMANDS
========================= */

async function handleJarvisCommand(command){

const t=
command.toLowerCase();

console.log(
"JARVIS:",
command
);


/* OFF */

if(
t.includes("jarvis off")||
t.includes("stop jarvis")||
t.includes("जार्विस बंद")||
t.includes("जार्विस ऑफ")
){

await speakJarvis(
"JARVIS deactivated."
);

stopJarvis();

return;

}


/* GOOGLE */

if(
t.includes("google kholo")||
t.includes("google खोलो")||
t.includes("गूगल खोलो")
){

await speakJarvis(
"Opening Google."
);

window.open(
"https://www.google.com",
"_blank"
);

return;

}


/* YOUTUBE */

if(
t.includes("youtube kholo")||
t.includes("youtube खोलो")||
t.includes("यूट्यूब खोलो")
){

await speakJarvis(
"Opening YouTube."
);

window.open(
"https://www.youtube.com",
"_blank"
);

return;

}


/* CLEAR */

if(
t.includes("chat clear")||
t.includes("chat saaf")||
t.includes("chat साफ")
){

clearChat();

await speakJarvis(
"Chat cleared."
);

return;

}


/* IMAGE */

if(
t.includes("image banao")||
t.includes("image बनाओ")||
t.includes("तस्वीर बनाओ")||
t.includes("photo banao")
){

let prompt=command
.replace(/image banao/gi,"")
.replace(/image बनाओ/gi,"")
.replace(/तस्वीर बनाओ/gi,"")
.replace(/photo banao/gi,"")
.trim();

if(!prompt){

await speakJarvis(
"Kaisi image banani hai?"
);

return;

}

messageInput.value=prompt;

await generateImage();

return;

}


/* NORMAL AI QUESTION */

await sendMessageText(
command,
true
);

}


/* =========================
   JARVIS SPEAK
========================= */

function speakJarvis(text){

return new Promise(resolve=>{

if(!("speechSynthesis" in window)){

resolve();
return;

}

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="hi-IN";

u.rate=0.9;

u.volume=1;

u.pitch=1;

u.onend=resolve;

u.onerror=resolve;

speechSynthesis.speak(u);

});

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
"beforeunload",
function(){

speechSynthesis.cancel();

if(jarvisRecognition){

try{
jarvisRecognition.stop();
}catch(e){}

}

});

</script>

</body>
  </html>
