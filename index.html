<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bablu AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080c;color:white;font-family:Arial}
header{text-align:center;padding:18px;background:#11111a}.container{max-width:800px;margin:auto;padding:15px}
button,input{border:0;border-radius:12px;padding:13px}button{background:#202040;color:white}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.jarvis{grid-column:1/3;background:#303080}
.chat{height:55vh;overflow:auto;margin:12px 0}.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#3030a0;margin-left:15%}.ai{background:#191922;margin-right:15%}
img{max-width:100%;border-radius:12px}.row{display:flex;gap:8px}
input{flex:1;background:#15151e;color:white}.status{text-align:center;color:#aaa;padding:8px}
</style>
</head>
<body>
<header><h1>🤖 Bablu AI</h1><p>Personal AI Assistant ✨</p></header>
<div class="container">
<div class="tools">
<button onclick="focusChat()">💬 AI Chat</button><button onclick="image()">🖼️ AI Image</button>
<button onclick="video()">🎬 AI Video</button><button onclick="study()">📚 Study</button>
<button onclick="writer()">✍️ Writer</button><button onclick="voice()">🎤 Voice</button>
<button class="jarvis" onclick="jarvis()">🤖 JARVIS: <span id="js">OFF</span></button>
</div>
<div class="status" id="status">Ready ✨</div>
<div class="chat" id="chat"></div>
<div class="row"><input id="msg" placeholder="Message Bablu AI..."><button onclick="send()">➤</button></div>
<div class="row" style="margin-top:8px">
<button onclick="voice()">🎤 Voice</button><button onclick="stop()">🔇 Stop</button>
<button onclick="clearChat()">🗑️ Clear</button>
</div>
</div>

<script>
let history=JSON.parse(localStorage.getItem("bablu_ai_history")||"[]"),on=false,rec=null,busy=false;
const msg=document.getElementById("msg"),chat=document.getElementById("chat"),status=document.getElementById("status");
const save=()=>localStorage.setItem("bablu_ai_history",JSON.stringify(history));
function add(t,type="ai"){let d=document.createElement("div");d.className="msg "+type;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function load(){history.forEach(x=>{if(x.type=="image"){let d=document.createElement("div"),i=document.createElement("img");d.className="msg ai";i.src=x.src;d.appendChild(i);chat.appendChild(d)}else add(x.text,x.role=="user"?"user":"ai")})}load();

async function sendText(t,jar=false){
if(!t)return;add(t,"user");history.push({role:"user",text:t});save();
status.textContent=jar?"🤖 JARVIS thinking...":"🧠 Thinking...";
try{let r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,mode:"chat"})});
let d=await r.json(),reply=d.reply||"Jawab nahi mila 😕";add(reply);history.push({role:"ai",text:reply});save();speak(reply)}
catch(e){add("Server se connection nahi ho paya. 😕")}
status.textContent=on?"🤖 JARVIS ready":"Ready ✨"
}
async function send(){let t=msg.value.trim();msg.value="";await sendText(t)}
msg.onkeydown=e=>{if(e.key=="Enter")send()};

function speak(t){
if(!("speechSynthesis"in window))return;
speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";u.rate=.9;
u.onend=()=>{if(on&&!busy)setTimeout(listen,500)};speechSynthesis.speak(u)
}
function stop(){
if(rec)try{rec.abort()}catch(e){}
speechSynthesis.cancel();busy=false;status.textContent=on?"🤖 Stopped — bolo":"Voice stopped 🔇";
}
function voice(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert("Voice supported nahi hai.");
stop();rec=new SR();rec.lang="hi-IN";rec.continuous=false;status.textContent="🎤 Sun raha hoon...";
rec.onresult=e=>{msg.value=e.results[0][0].transcript;send()};rec.start()
}

async function image(){
let p=msg.value.trim()||prompt("Kaisi image banani hai? 🎨");if(!p)return;msg.value="";
status.textContent="🎨 Image bana raha hoon...";
try{let x=await puter.ai.txt2img(p,{model:"gpt-image-2"}),src=typeof x=="string"?x:x.src||x.url;
let d=document.createElement("div"),i=document.createElement("img");d.className="msg ai";i.src=src;d.appendChild(i);chat.appendChild(d);
history.push({type:"image",src});save();status.textContent="Image ready ✅"}catch(e){add("Image generate nahi ho payi 😕")}
}
function video(){add("🎬 AI Video feature V2 me connect kiya jayega 🚀")}
function study(){msg.value="Mujhe Study me help karo 📚: ";msg.focus()}
function writer(){msg.value="Mujhe Writing me help karo ✍️: ";msg.focus()}
function focusChat(){msg.focus()}
function clearChat(){history=[];save();chat.innerHTML="";add("Chat clear ho gaya 😊")}

function search(url,n){window.open(url,"_blank");status.textContent="🔎 "+n+" search opened"}

async function command(c){
let t=c.toLowerCase().trim();

if(/jarvis off|जार्विस बंद|jarvis stop|जार्विस रुक/.test(t)){
on=false;stop();document.getElementById("js").textContent="OFF";speak("ठीक है, JARVIS बंद कर रहा हूँ");return
}

if(/chat clear|clear chat|chat saaf|chat साफ|चैट साफ|चैट क्लियर|सब चैट मिटा/.test(t)){
clearChat();speak("Chat साफ कर दिया");return
}

if(/time|समय|कितने बजे|टाइम/.test(t)){
let x=new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
speak("अभी "+x+" बज रहे हैं");return
}

if(/date|तारीख|आज की तारीख|आज कौन सी तारीख/.test(t)){
let x=new Date().toLocaleDateString("hi-IN",{day:"numeric",month:"long",year:"numeric"});
speak("आज "+x+" है");return
}

let sites=[
["google",/google|गूगल/,"https://www.google.com/search?q=","Google"],
["youtube",/youtube|यूट्यूब/,"https://www.youtube.com/results?search_query=","YouTube"],
["instagram",/instagram|इंस्टाग्राम/,"https://www.instagram.com/explore/search/keyword/?q=","Instagram"],
["facebook",/facebook|फेसबुक/,"https://www.facebook.com/search/top?q=","Facebook"]
];

for(let s of sites)if(s[1].test(t)){
let q=t.replace(s[1],"").replace(/par|pe|me|mein|search|karo|kar do|पर|पे|में|सर्च|करो|कर दो/g,"").trim();
if(q){speak(s[3]+" par search kar raha hoon");search(s[2]+encodeURIComponent(q),s[3]);return}
}

if(/image banao|image bana|photo banao|तस्वीर बनाओ|इमेज बनाओ/.test(t)){
let p=c.replace(/image\s*banao?|photo\s*banao|तस्वीर बनाओ|इमेज बनाओ/gi,"").trim();
if(!p)return speak("Kaisi image banani hai?");
msg.value=p;await image();return
}

await sendText(c,true)
}

function jarvis(){
if(on){on=false;stop();document.getElementById("js").textContent="OFF";return}
on=true;document.getElementById("js").textContent="ON";speak("JARVIS activated. Main sun raha hoon")
}
function listen(){
if(!on||busy)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
rec=new SR();rec.lang="hi-IN";rec.continuous=false;status.textContent="🤖 Listening... 🎤";
rec.onresult=async e=>{busy=true;await command(e.results[0][0].transcript);busy=false};
rec.onerror=()=>{busy=false;if(on)setTimeout(listen,1000)};
rec.onend=()=>{if(on&&!busy&&speechSynthesis.speaking===false)setTimeout(listen,700)};
rec.start()
}
</script>
</body>
  </html>
