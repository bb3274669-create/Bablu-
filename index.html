<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bablu AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font-family:Arial}
header{padding:14px;background:#11111a;text-align:center;position:relative}
header h1{margin:0}.top{position:absolute;right:10px;top:12px;display:flex;gap:6px}
.top button,.jar,.ctrl{border:1px solid #5555ff;background:#15152d;color:#fff;border-radius:20px;box-shadow:0 0 12px #33338a}
.c{max-width:800px;margin:auto;padding:14px}.screen{display:none}.active{display:block}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
button,input{border:0;padding:12px;border-radius:14px}button{color:#fff;background:#202040}
.tools button{min-height:55px;font-size:15px}.row{display:flex;gap:7px}
.row input{flex:1;background:#15151e;color:#fff;outline:0}
.chat{height:55vh;overflow:auto;margin:10px 0}.msg{padding:12px;margin:8px 0;border-radius:14px;white-space:pre-wrap}
.user{background:#3030a0;margin-left:15%}.ai{background:#191922;margin-right:15%}
.st{text-align:center;color:#aaa;padding:8px;min-height:30px}
.ctrl{padding:9px 13px;font-size:12px}.speak{font-size:12px;padding:7px 11px;margin-top:7px}
.jar{display:block;margin:28px auto 5px;padding:10px 22px;font-weight:bold}
.back{margin-bottom:10px}.box{margin-top:20px}.box input{width:100%;background:#15151e;color:#fff}
img{max-width:100%;border-radius:14px;margin-top:10px}
.think{display:inline-block;animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>

<header>
<h1>🤖 Bablu AI</h1><small>Personal AI Assistant ✨</small>
<div class="top">
<button onclick="settings()">⚙️</button>
<button onclick="jarvis()">🤖</button>
</div>
</header>

<div class="c">

<section id="home" class="screen active">
<div class="tools">
<button onclick="openScreen('chat')">💬 Chat</button>
<button onclick="openScreen('image')">🖼️ Image</button>
<button onclick="openScreen('video')">🎬 Video</button>
<button onclick="openScreen('study')">📚 Study</button>
<button onclick="openScreen('writer')">✍️ Writer</button>
<button onclick="openScreen('voiceStudio')">🗣️ Voice Studio</button>
</div>
<div id="st" class="st">Ready ✨</div>
<button class="jar" onclick="jarvis()">🤖 JARVIS</button>
</section>

<section id="chat" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>💬 Chat</h2><div id="chatbox" class="chat"></div>
<div class="row">
<input id="msg" placeholder="Message Bablu AI...">
<button class="ctrl" onclick="voice()">🎤</button>
<button class="ctrl" onclick="send()">➤</button>
</div>
<div class="row" style="margin-top:7px">
<button class="ctrl" onclick="stop()">🔇 Stop</button>
<button class="ctrl" onclick="clearChat()">🗑️ Clear</button>
</div>
</section>

<section id="image" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>🖼️ AI Image</h2><div id="ist" class="st">Prompt लिखो 🎨</div>
<div class="row"><input id="ip" placeholder="Describe image..."><button class="ctrl" onclick="makeImage()">➤</button></div>
<div id="out"></div>
</section>

<section id="video" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>🎬 AI Video</h2><div class="box">
<input id="vp" placeholder="Video prompt...">
<button class="ctrl" onclick="video()">🎬 Generate</button>
</div><div id="vout" class="st">AI Video Generator 🚀</div>
</section>

<section id="study" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>📚 Study</h2>
<div class="box"><input id="sp" placeholder="What do you want to study?">
<button class="ctrl" onclick="studySend()">➤ Ask</button></div>
</section>

<section id="writer" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>✍️ Writer</h2>
<div class="box"><input id="wp" placeholder="What should I write?">
<button class="ctrl" onclick="writerSend()">➤ Create</button></div>
</section>

<section id="voiceStudio" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>🗣️ AI Voice Studio</h2>
<div class="st">Voice Studio 🚀<br>Voice packs and advanced voice features coming soon.</div>
</section>

<section id="settings" class="screen">
<button class="ctrl back" onclick="back()">↩️ Back</button>
<h2>⚙️ Settings</h2>
<div class="st">Bablu AI Settings ⚙️<br>More settings coming soon.</div>
</section>

</div>

<script>
let H=JSON.parse(localStorage.getItem("bablu_ai_history")||"[]"),
r=null,speaking=0,jar=0,token=0;
const $=x=>document.getElementById(x),chat=$("chatbox"),msg=$("msg"),
st=$("st"),save=()=>localStorage.setItem("bablu_ai_history",JSON.stringify(H));

function openScreen(x){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));$(x).classList.add("active")}
function back(){stopListen();openScreen("home");st.textContent="Ready ✨"}
function settings(){openScreen("settings")}

function add(t,type="ai"){
let d=document.createElement("div");d.className="msg "+type;d.textContent=t;
if(type=="ai"){let b=document.createElement("button");b.className="speak";b.textContent="🔊 Speak";b.onclick=()=>speak(t);d.append("\n");d.append(b)}
chat.append(d);chat.scrollTop=chat.scrollHeight
}
H.forEach(x=>x.type=="image"?null:add(x.text,x.role=="user"?"user":"ai"));

function speak(t){
speechSynthesis.cancel();speaking=1;
let u=new SpeechSynthesisUtterance(t.replace(/[*_~#>`]/g," "));
u.lang=/[a-z]/i.test(t)?"en-IN":"hi-IN";u.rate=.95;
u.onend=()=>speaking=0;speechSynthesis.speak(u)
}

function stopListen(){token++;if(r)try{r.abort()}catch(e){}r=null}
function stop(){speechSynthesis.cancel();speaking=0;stopListen();jar=0;st.textContent="🔇 Stopped — JARVIS ready"}
function focusInput(){openScreen("chat");msg.focus()}

async function sendText(t){
if(!t)return;add(t,"user");H.push({role:"user",text:t});save();
st.innerHTML='<span class="think">🧠 Thinking...</span>';
try{
let x=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:t,mode:"chat"})}),d=await x.json(),a=d.reply||"Jawab nahi mila 😕";
add(a);H.push({role:"ai",text:a});save();st.textContent="Ready ✨"
}catch(e){add("Server connection nahi hua 😕");st.textContent="Ready ✨"}
}
async function send(){let t=msg.value.trim();msg.value="";await sendText(t)}
msg.onkeydown=e=>{if(e.key=="Enter")send()};

function getSpeech(){
return window.SpeechRecognition||window.webkitSpeechRecognition
}
function voice(){
let S=getSpeech();if(!S)return;
stopListen();let id=++token;r=new S;r.lang="hi-IN";r.interimResults=false;r.maxAlternatives=3;
r.onresult=e=>{if(id!=token)return;let a=[...e.results[0]].map(x=>x.transcript),
t=a.find(x=>/(chat|चैट|image|इमेज|youtube|यूट्यूब|google|गूगल|home|होम|stop|रुको|time|टाइम)/i.test(x))||a[0];
msg.value=t;send()};r.onend=()=>r=null;r.start();st.textContent="🎤 Sun raha hoon..."
}

async function makeImage(){
let p=$("ip").value.trim();if(!p)return;
$("ist").textContent="🎨 Bana raha hoon...";
try{let x=await puter.ai.txt2img(p,{model:"gpt-image-2"}),
src=typeof x=="string"?x:x.src||x.url;$("out").innerHTML=`<img src="${src}">`;
H.push({type:"image",src});save();$("ist").textContent="Image ready ✅"
}catch(e){$("ist").textContent="Image failed 😕"}
}

function video(){$("vout").textContent="🎬 AI Video Generator — coming soon 🚀"}
async function studySend(){let t=$("sp").value.trim();if(t){openScreen("chat");await sendText("Study help: "+t)}}
async function writerSend(){let t=$("wp").value.trim();if(t){openScreen("chat");await sendText("Writing help: "+t)}}
function clearChat(){H=[];save();chat.innerHTML="";add("Chat clear ho gaya 😊")}

function webSearch(u){window.open(u,"_blank")}

async function command(c){
let t=c.toLowerCase().trim();

if(/stop|रुको|चुप|बंद करो/.test(t)){stop();return}
if(/home|होम|मुख्य स्क्रीन/.test(t)){back();return}
if(/clear|साफ|क्लियर|मिटा/.test(t)){clearChat();return}

let m=t.match(/(?:chat|चैट).{0,20}(?:mein|में|me)\s+(.+?)\s+(likho|लिखो|type|टाइप|bhejo|भेजो|send|सेंड)/i);
if(m){
openScreen("chat");msg.value=m[1];
if(/bhejo|भेजो|send|सेंड/i.test(m[2]))await send();
return
}

if(/chat kholo|chat open|चैट खोलो/.test(t)){openScreen("chat");return}

if(/image|इमेज|तस्वीर|फोटो/.test(t)){
openScreen("image");
let p=t.replace(/image|इमेज|तस्वीर|फोटो|banao|बनाओ|generate|बना दो/gi,"").trim();
if(p){$("ip").value=p;await makeImage()}return
}

if(/video|वीडियो/.test(t)){openScreen("video");return}
if(/study|स्टडी|पढ़ाई/.test(t)){openScreen("study");return}
if(/writer|writing|राइटर|लेखन/.test(t)){openScreen("writer");return}
if(/voice studio|वॉइस स्टूडियो/.test(t)){openScreen("voiceStudio");return}
if(/setting|settings|सेटिंग/.test(t)){openScreen("settings");return}

if(/time|टाइम|समय|कितने बजे/.test(t)){
speak("अभी "+new Date().toLocaleTimeString("hi-IN"));return
}
if(/date|तारीख|दिनांक|आज कौन सा दिन/.test(t)){
speak("आज "+new Date().toLocaleDateString("hi-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));return
}

let sites=[
[/youtube|यूट्यूब/,"https://www.youtube.com/results?search_query="],
[/google|गूगल/,"https://www.google.com/search?q="],
[/instagram|इंस्टाग्राम/,"https://www.instagram.com/explore/search/keyword/?q="],
[/facebook|फेसबुक/,"https://www.facebook.com/search/top?q="]
];
for(let s of sites)if(s[0].test(t)){
let q=t.replace(s[0],"").replace(/pe|par|mein|me|search|karo|करो|में|पर|सर्च|खोजो/g,"").trim();
if(q){webSearch(s[1]+encodeURIComponent(q));return}
}
openScreen("chat");await sendText(c)
}

function jarvis(){
if(jar){jar=0;stopListen();st.textContent="🤖 JARVIS OFF";return}
jar=1;listen()
}

function listen(){
if(!jar)return;let S=getSpeech();if(!S)return;
stopListen();let id=++token;r=new S;r.lang="hi-IN";r.continuous=false;
r.interimResults=false;r.maxAlternatives=3;st.textContent="🤖 JARVIS सुन रहा है...";
r.onresult=async e=>{
if(id!=token)return;
let a=[...e.results[0]].map(x=>x.transcript),
t=a.find(x=>/(chat|चैट|image|इमेज|video|वीडियो|study|स्टडी|writer|राइटर|youtube|यूट्यूब|google|गूगल|home|होम|stop|रुको|time|टाइम)/i.test(x))||a[0];
await command(t)
};
r.onerror=()=>{if(jar)st.textContent="🎤 Dobara bolo"};
r.onend=()=>{r=null;if(jar&&id==token&&!speaking)setTimeout(()=>listen(),350)};
r.start()
}
</script>
</body>
  </html>
