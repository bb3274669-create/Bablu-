<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bablu AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#08080c;
  color:white;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px;
  text-align:center;
  background:#0d0d12;
  border-bottom:1px solid #292932;
}

header h1{
  font-size:25px;
}

header p{
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px 14px 30px;
}

.welcome{
  text-align:center;
  padding:25px 10px;
}

.robot{
  font-size:50px;
}

.welcome h2{
  margin-top:10px;
  font-size:22px;
}

.welcome p{
  color:#999;
  margin-top:7px;
  font-size:14px;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tool{
  background:#111116;
  color:white;
  border:1px solid #292932;
  border-radius:10px;
  padding:15px 8px;
  cursor:pointer;
}

.tool:hover{
  background:#19191f;
}

.tool strong{
  display:block;
  font-size:13px;
}

.tool small{
  color:#888;
  font-size:10px;
}

.chat{
  margin-top:20px;
  background:#0e0e13;
  border:1px solid #292932;
  border-radius:12px;
  overflow:hidden;
}

.chat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  border-bottom:1px solid #292932;
}

.chat-header strong{
  font-size:14px;
}

.clear{
  background:#19191f;
  color:#ff7777;
  border:1px solid #33333b;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
}

.messages{
  min-height:250px;
  max-height:430px;
  overflow-y:auto;
  padding:12px;
}

.message{
  margin:9px 0;
  padding:10px 12px;
  border-radius:12px;
  max-width:85%;
  line-height:1.4;
  font-size:14px;
  white-space:pre-wrap;
}

.user{
  margin-left:auto;
  background:#252530;
}

.ai{
  margin-right:auto;
  background:#15151c;
  border:1px solid #292932;
}

.input-area{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid #292932;
}

#messageInput{
  flex:1;
  min-width:0;
  background:#15151b;
  color:white;
  border:1px solid #30303a;
  border-radius:9px;
  padding:12px;
  outline:none;
}

#messageInput:focus{
  border-color:#555566;
}

.voice-btn{
  width:46px;
  border:1px solid #30303a;
  background:#19191f;
  color:white;
  border-radius:9px;
  font-size:20px;
  cursor:pointer;
}

.voice-btn.listening{
  background:#7a2020;
  border-color:#ff5555;
}

.send-btn{
  background:#292934;
  color:white;
  border:0;
  border-radius:9px;
  padding:0 15px;
  cursor:pointer;
}

.typing{
  color:#888;
  font-size:12px;
  padding:8px;
}

@media(max-width:500px){
  .container{
    padding:12px 10px 25px;
  }

  .message{
    max-width:90%;
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 Bablu AI</h1>
  <p>Your AI assistant</p>
</header>

<div class="container">

  <div class="welcome">
    <div class="robot">🤖</div>
    <h2>Hello! I'm Bablu AI</h2>
    <p>Ask me anything and let's create something amazing.</p>
  </div>

  <div class="tools">

    <button class="tool" onclick="selectTool('Chat')">
      <strong>💬 AI Chat</strong>
      <small>Ask anything</small>
    </button>

    <button class="tool" onclick="selectTool('Image')">
      <strong>🖼️ AI Image</strong>
      <small>Create images</small>
    </button>

    <button class="tool" onclick="selectTool('Video')">
      <strong>🎬 AI Video</strong>
      <small>Create videos</small>
    </button>

    <button class="tool" onclick="selectTool('Voice')">
      <strong>🔊 AI Voice</strong>
      <small>Voice tools</small>
    </button>

    <button class="tool" onclick="selectTool('Study')">
      <strong>📚 AI Study</strong>
      <small>Learn smarter</small>
    </button>

    <button class="tool" onclick="selectTool('Writer')">
      <strong>✍️ AI Writer</strong>
      <small>Write anything</small>
    </button>

  </div>

  <div class="chat">

    <div class="chat-header">
      <strong>💬 Chat with Bablu AI</strong>
      <button class="clear" onclick="clearChat()">Clear</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
      >

      <button
        class="voice-btn"
        id="voiceBtn"
        onclick="startVoice()"
        title="Voice Input"
      >
        🎤
      </button>

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>

</div>

<script>

let chatHistory =
  JSON.parse(localStorage.getItem("bablu_ai_history") || "[]");

chatHistory = chatHistory.slice(-20);

function saveHistory(){

  chatHistory = chatHistory.slice(-20);

  localStorage.setItem(
    "bablu_ai_history",
    JSON.stringify(chatHistory)
  );
}

function addMessage(text,type,save=true){

  const messages =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  if(save){

    chatHistory.push({
      text:text,
      type:type
    });

    chatHistory =
      chatHistory.slice(-20);

    saveHistory();
  }
}

function loadHistory(){

  chatHistory =
    chatHistory.slice(-20);

  chatHistory.forEach(item => {

    addMessage(
      item.text,
      item.type,
      false
    );

  });
}

function clearChat(){

  localStorage.removeItem(
    "bablu_ai_history"
  );

  chatHistory=[];

  document.getElementById(
    "messages"
  ).innerHTML="";
}

function selectTool(tool){

  addMessage(
    tool + " feature अभी upgrade हो रहा है 🚀",
    "ai"
  );
}

/* VOICE INPUT */

let recognition;
let isListening=false;

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice Input इस browser में supported नहीं है। Chrome में try करो।"
    );

    return;
  }

  if(isListening){

    recognition.stop();
    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang="hi-IN";
  recognition.interimResults=false;
  recognition.continuous=false;

  recognition.onstart=function(){

    isListening=true;

    document.getElementById(
      "voiceBtn"
    ).classList.add("listening");

    document.getElementById(
      "voiceBtn"
    ).textContent="⏹️";
  };

  recognition.onresult=function(event){

    const text =
      event.results[0][0].transcript;

    document.getElementById(
      "messageInput"
    ).value=text;
  };

  recognition.onerror=function(){

    isListening=false;

    document.getElementById(
      "voiceBtn"
    ).classList.remove("listening");

    document.getElementById(
      "voiceBtn"
    ).textContent="🎤";
  };

  recognition.onend=function(){

    isListening=false;

    document.getElementById(
      "voiceBtn"
    ).classList.remove("listening");

    document.getElementById(
      "voiceBtn"
    ).textContent="🎤";
  };

  recognition.start();
}

/* SEND MESSAGE */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value="";

  const messages =
    document.getElementById("messages");

  const typing =
    document.createElement("div");

  typing.className="typing";

  typing.textContent="Bablu AI सोच रहा है...";

  messages.appendChild(typing);

  messages.scrollTop =
    messages.scrollHeight;

  try{

    const response =
      await fetch("/api",{

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          message:text
        })

      });

    const data =
      await response.json();

    typing.remove();

    addMessage(
      data.reply ||
      "मुझे जवाब नहीं मिला।",
      "ai"
    );

  }catch(error){

    typing.remove();

    addMessage(
      "Server से connection नहीं हो पाया।",
      "ai"
    );
  }
}

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key==="Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();
      }

    }
  );

loadHistory();

</script>

</body>
  </html>
