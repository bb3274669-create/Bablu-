<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bablu AI</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#08080c;
  color:white;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  background:#11111a;
  border-bottom:1px solid #29293a;
}

header h1{
  font-size:25px;
}

header p{
  color:#aaa;
  margin-top:5px;
  font-size:13px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.tool{
  background:#151520;
  color:white;
  border:1px solid #303044;
  border-radius:14px;
  padding:15px;
  text-align:left;
  cursor:pointer;
}

.tool strong{
  display:block;
  font-size:15px;
}

.tool small{
  display:block;
  color:#999;
  margin-top:5px;
}

.jarvis-tool{
  grid-column:1/-1;
  border-color:#5555ff;
}

.jarvis-on{
  background:#17174a;
  border-color:#7777ff;
}

.jarvis-status{
  display:none;
  text-align:center;
  background:#14142a;
  border:1px solid #4d4dff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  color:#aaaaff;
}

.chat{
  min-height:350px;
  max-height:58vh;
  overflow-y:auto;
  padding:5px;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  max-width:88%;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  margin-left:auto;
  background:#3030a0;
}

.ai{
  margin-right:auto;
  background:#191922;
  border:1px solid #292936;
}

.jarvis-message{
  border-left:3px solid #7777ff;
}

.message img{
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.bottom{
  position:sticky;
  bottom:0;
  background:#08080c;
  padding-top:10px;
}

.input-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:14px;
  border-radius:13px;
  border:1px solid #333344;
  background:#15151e;
  color:white;
  outline:none;
}

button{
  border:0;
  border-radius:13px;
  cursor:pointer;
}

.send{
  width:52px;
  background:#4b4bff;
  color:white;
  font-size:20px;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.action-row button{
  padding:11px;
  background:#171720;
  color:white;
  border:1px solid #30303e;
}

.status{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:7px;
}

@media(max-width:450px){
  .tools{
    grid-template-columns:1fr 1fr;
  }

  .message{
    max-width:94%;
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 Bablu AI</h1>
  <p>Your Personal AI Assistant</p>
</header>

<div class="container">

  <div class="tools">

    <button class="tool" onclick="focusChat()">
      <strong>💬 AI Chat</strong>
      <small>Ask anything</small>
    </button>

    <button class="tool" onclick="generateImage()">
      <strong>🖼️ AI Image</strong>
      <small>Create real images</small>
    </button>

    <button class="tool" onclick="videoTool()">
      <strong>🎬 AI Video</strong>
      <small>Video tool</small>
    </button>

    <button class="tool" onclick="studyTool()">
      <strong>📚 Study</strong>
      <small>Study assistant</small>
    </button>

    <button class="tool" onclick="writerTool()">
      <strong>✍️ Writer</strong>
      <small>Writing assistant</small>
    </button>

    <button class="tool" onclick="startVoice()">
      <strong>🎤 Voice</strong>
      <small>Speak to Bablu AI</small>
    </button>

    <button class="tool jarvis-tool" id="jarvisTool"
            onclick="toggleJarvis()">

      <strong>🤖 JARVIS MODE</strong>
      <small id="jarvisSmall">
        Activate your AI assistant
      </small>

    </button>

  </div>

  <div class="jarvis-status" id="jarvisStatus">
    🤖 JARVIS is OFF
  </div>

  <div class="chat" id="chat"></div>

  <div class="bottom">

    <div class="status" id="status">
      Ready
    </div>

    <div class="input-row">

      <input
        id="message"
        placeholder="Message Bablu AI..."
        autocomplete="off"
      >

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

    <div class="action-row">

      <button onclick="startVoice()">
        🎤 Voice
      </button>

      <button onclick="stopVoice()">
        🔇 Stop
      </button>

      <button onclick="clearChat()">
        🗑️ Clear
      </button>

    </div>

  </div>

</div>

<script>

let chatHistory =
  JSON.parse(localStorage.getItem("bablu_ai_history") || "[]");

let jarvisMode = false;
let recognition = null;
let jarvisRecognition = null;


/* =========================
   ELEMENTS
========================= */

const messageInput =
  document.getElementById("message");

const chat =
  document.getElementById("chat");

const statusText =
  document.getElementById("status");

const jarvisStatus =
  document.getElementById("jarvisStatus");

const jarvisTool =
  document.getElementById("jarvisTool");

const jarvisSmall =
  document.getElementById("jarvisSmall");


/* =========================
   CHAT HISTORY
========================= */

function saveHistory(){
  localStorage.setItem(
    "bablu_ai_history",
    JSON.stringify(chatHistory)
  );
}

function addMessage(text,type="ai",isJarvis=false){

  const div=document.createElement("div");

  div.className=
    "message "+
    type+
    (isJarvis ? " jarvis-message" : "");

  div.textContent=text;

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;

  return div;
}

function addImage(src){

  const div=document.createElement("div");

  div.className="message ai";

  const img=document.createElement("img");

  img.src=src;

  div.appendChild(img);

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;
}

function loadHistory(){

  chat.innerHTML="";

  chatHistory.forEach(item=>{

    if(item.type==="image"){
      addImage(item.src);
    }else{
      addMessage(
        item.text,
        item.role==="user" ? "user" : "ai"
      );
    }

  });
}

loadHistory();


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

  chatHistory=[];

  saveHistory();

  chat.innerHTML="";

  addMessage(
    "Chat clear ho gaya 😊",
    "ai"
  );
}


/* =========================
   NORMAL CHAT
========================= */

async function sendMessage(){

  const text=messageInput.value.trim();

  if(!text)return;

  messageInput.value="";

  await sendMessageText(text,false);
}


async function sendMessageText(text,fromJarvis=false){

  addMessage(
    text,
    "user",
    fromJarvis
  );

  chatHistory.push({
    role:"user",
    text:text
  });

  saveHistory();

  statusText.textContent="Thinking...";

  try{

    const response=await fetch("/api",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text,
        mode:"chat"
      })

    });

    const data=await response.json();

    const reply=
      data.reply ||
      "Mujhe jawab nahi mila.";

    addMessage(
      reply,
      "ai",
      fromJarvis
    );

    chatHistory.push({
      role:"ai",
      text:reply
    });

    saveHistory();

    if(fromJarvis){
      speakJarvis(reply);
    }else{
      speak(reply);
    }

  }catch(error){

    addMessage(
      "Server se connection nahi ho paya.",
      "ai"
    );

  }

  statusText.textContent="Ready";
}


/* =========================
   ENTER KEY
========================= */

messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      sendMessage();
    }

  }
);


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  if(!("webkitSpeechRecognition" in window) &&
     !("SpeechRecognition" in window)){

    alert("Is browser me Voice Input supported nahi hai.");

    return;
  }

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition=new SpeechRecognition();

  recognition.lang="hi-IN";

  recognition.continuous=false;

  recognition.interimResults=false;

  statusText.textContent="🎤 Sun raha hoon...";

  recognition.start();

  recognition.onresult=function(event){

    const text=
      event.results[0][0].transcript;

    messageInput.value=text;

    statusText.textContent="Voice received";

    sendMessage();

  };

  recognition.onerror=function(){

    statusText.textContent="Voice error";

  };

  recognition.onend=function(){

    if(statusText.textContent!=="Voice received"){
      statusText.textContent="Ready";
    }

  };
}


function stopVoice(){

  if(recognition){

    recognition.stop();

  }

  if(jarvisRecognition){

    jarvisRecognition.stop();

  }

  window.speechSynthesis.cancel();

  statusText.textContent="Voice stopped";
}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

  if(!("speechSynthesis" in window))return;

  window.speechSynthesis.cancel();

  const utterance=
    new SpeechSynthesisUtterance(text);

  utterance.lang="hi-IN";

  utterance.rate=1;

  utterance.pitch=1;

  window.speechSynthesis.speak(
    utterance
  );
}


/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(){

  let prompt=
    messageInput.value.trim();

  if(!prompt){

    prompt=
      window.prompt(
        "Kaisi image banani hai?"
      );

  }

  if(!prompt)return;

  messageInput.value="";

  addMessage(
    "🖼️ Image generate kar raha hoon...",
    "ai"
  );

  statusText.textContent=
    "Creating image...";

  try{

    const generatedImage=
      await puter.ai.txt2img(
        prompt,
        {
          model:"gpt-image-2"
        }
      );

    let src="";

    if(typeof generatedImage==="string"){

      src=generatedImage;

    }else if(
      generatedImage &&
      generatedImage.src
    ){

      src=generatedImage.src;

    }else if(
      generatedImage &&
      generatedImage.url
    ){

      src=generatedImage.url;

    }else{

      src=generatedImage;

    }

    addImage(src);

    chatHistory.push({
      type:"image",
      src:src
    });

    saveHistory();

    statusText.textContent=
      "Image ready ✅";

  }catch(error){

    console.error(error);

    addMessage(
      "Image generate nahi ho payi. Please dobara try karo.",
      "ai"
    );

    statusText.textContent=
      "Image error";

  }

}


/* =========================
   VIDEO TOOL
========================= */

function videoTool(){

  addMessage(
    "🎬 AI Video feature V2 me connect kiya jayega. Video tool ready hai.",
    "ai"
  );

}


/* =========================
   STUDY TOOL
========================= */

function studyTool(){

  messageInput.value=
    "Mujhe study me help karo: ";

  messageInput.focus();

}


/* =========================
   WRITER TOOL
========================= */

function writerTool(){

  messageInput.value=
    "Mujhe writing me help karo: ";

  messageInput.focus();

}


/* =========================
   JARVIS
========================= */

function toggleJarvis(){

  jarvisMode=!jarvisMode;

  if(jarvisMode){

    jarvisStatus.style.display="block";

    jarvisStatus.textContent=
      "🤖 JARVIS is ON — Listening...";

    jarvisTool.classList.add(
      "jarvis-on"
    );

    jarvisSmall.textContent=
      "JARVIS is active";

    speakJarvis(
      "JARVIS mode activated."
    );

    setTimeout(
      startJarvisListening,
      1200
    );

  }else{

    stopJarvis();

  }

}


function stopJarvis(){

  jarvisMode=false;

  if(jarvisRecognition){

    jarvisRecognition.stop();

    jarvisRecognition=null;

  }

  jarvisStatus.style.display="block";

  jarvisStatus.textContent=
    "🤖 JARVIS is OFF";

  jarvisTool.classList.remove(
    "jarvis-on"
  );

  jarvisSmall.textContent=
    "Activate your AI assistant";

  window.speechSynthesis.cancel();

}


function startJarvisListening(){

  if(!jarvisMode)return;

  if(
    !("webkitSpeechRecognition" in window) &&
    !("SpeechRecognition" in window)
  ){

    jarvisStatus.textContent=
      "🎤 Voice recognition supported nahi hai.";

    return;

  }

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  jarvisRecognition=
    new SpeechRecognition();

  jarvisRecognition.lang="hi-IN";

  jarvisRecognition.continuous=false;

  jarvisRecognition.interimResults=false;

  jarvisStatus.textContent=
    "🤖 JARVIS is listening...";

  try{

    jarvisRecognition.start();

  }catch(e){

    return;

  }

  jarvisRecognition.onresult=
    function(event){

      const command=
        event.results[0][0]
        .transcript
        .trim();

      handleJarvisCommand(command);

    };

  jarvisRecognition.onerror=
    function(){

      if(jarvisMode){

        setTimeout(
          startJarvisListening,
          1000
        );

      }

    };

  jarvisRecognition.onend=
    function(){

      if(jarvisMode){

        setTimeout(
          startJarvisListening,
          700
        );

      }

    };

}


/* =========================
   JARVIS COMMANDS
========================= */

async function handleJarvisCommand(command){

  const text=
    command.toLowerCase();

  console.log(
    "JARVIS COMMAND:",
    command
  );


  /* OFF */

  if(
    text.includes("jarvis off") ||
    text.includes("stop jarvis") ||
    text.includes("जार्विस बंद") ||
    text.includes("जर्विस बंद") ||
    text.includes("जार्विस ऑफ")
  ){

    speakJarvis(
      "JARVIS mode deactivated."
    );

    setTimeout(
      stopJarvis,
      1000
    );

    return;

  }


  /* GOOGLE */

  if(
    text.includes("google kholo") ||
    text.includes("google खोलो") ||
    text.includes("google open") ||
    text.includes("गूगल खोलो")
  ){

    speakJarvis(
      "Google opening."
    );

    setTimeout(
      function(){

        window.open(
          "https://www.google.com",
          "_blank"
        );

      },
      700
    );

    return;

  }


  /* YOUTUBE */

  if(
    text.includes("youtube kholo") ||
    text.includes("youtube खोलो") ||
    text.includes("youtube open") ||
    text.includes("यूट्यूब खोलो")
  ){

    speakJarvis(
      "YouTube opening."
    );

    setTimeout(
      function(){

        window.open(
          "https://www.youtube.com",
          "_blank"
        );

      },
      700
    );

    return;

  }


  /* CLEAR CHAT */

  if(
    text.includes("chat clear") ||
    text.includes("chat साफ") ||
    text.includes("chat saaf") ||
    text.includes("chat delete")
  ){

    clearChat();

    speakJarvis(
      "Chat clear kar diya."
    );

    return;

  }


  /* IMAGE */

  if(
    text.includes("image banao") ||
    text.includes("image बनाओ") ||
    text.includes("image banana") ||
    text.includes("तस्वीर बनाओ") ||
    text.includes("photo banao") ||
    text.includes("generate image")
  ){

    let prompt=
      command
      .replace(/image banao/gi,"")
      .replace(/image बनाओ/gi,"")
      .replace(/image banana/gi,"")
      .replace(/तस्वीर बनाओ/gi,"")
      .replace(/photo banao/gi,"")
      .replace(/generate image/gi,"")
      .trim();

    if(!prompt){

      speakJarvis(
        "Kaisi image banani hai?"
      );

      return;

    }

    messageInput.value=prompt;

    speakJarvis(
      "Image generation started."
    );

    await generateImage();

    return;

  }


  /* NORMAL AI */

  speakJarvis(
    "Samajh gaya."
  );

  await sendMessageText(
    command,
    true
  );

}


/* =========================
   JARVIS VOICE
========================= */

function speakJarvis(text){

  if(!("speechSynthesis" in window))
    return;

  window.speechSynthesis.cancel();

  const utterance=
    new SpeechSynthesisUtterance(text);

  utterance.lang="hi-IN";

  utterance.rate=1;

  utterance.pitch=1;

  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   FOCUS
========================= */

function focusChat(){

  messageInput.focus();

}


/* =========================
   STOP SPEECH WHEN NEEDED
========================= */

window.addEventListener(
  "beforeunload",
  function(){

    window.speechSynthesis.cancel();

  }
);

</script>

</body>
      </html>
