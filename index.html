<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bablu AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #292932;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 7px;
      color: #aaa;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px;
    }

    .welcome {
      text-align: center;
      padding: 25px 10px;
    }

    .welcome .robot {
      font-size: 55px;
    }

    .welcome h2 {
      margin-top: 10px;
      font-size: 24px;
    }

    .welcome p {
      color: #aaa;
      margin-top: 8px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .tool {
      background: #17171e;
      border: 1px solid #2c2c35;
      border-radius: 16px;
      padding: 20px 12px;
      color: white;
      cursor: pointer;
      text-align: center;
    }

    .tool:hover {
      transform: translateY(-2px);
      border-color: #666;
    }

    .tool .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .tool h3 {
      font-size: 16px;
    }

    .tool p {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    .chat {
      margin-top: 22px;
      background: #121218;
      border: 1px solid #292932;
      border-radius: 18px;
      padding: 15px;
    }

    .chat h3 {
      margin-bottom: 12px;
    }

    #messages {
      min-height: 80px;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .message {
      background: #1d1d25;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #33333d;
      background: #0d0d12;
      color: white;
      outline: none;
    }

    #sendBtn {
      padding: 13px 17px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px 10px;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .tools {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 Bablu AI</h1>
    <p>All-in-One AI Assistant</p>
  </header>

  <main class="container">

    <section class="welcome">
      <div class="robot">🤖</div>
      <h2>Hello! I'm Bablu AI</h2>
      <p>Choose an AI tool and let's create something amazing.</p>
    </section>

    <section class="tools">

      <button class="tool" onclick="selectTool('Chat')">
        <div class="icon">💬</div>
        <h3>AI Chat</h3>
        <p>Ask anything</p>
      </button>

      <button class="tool" onclick="selectTool('Image')">
        <div class="icon">🖼️</div>
        <h3>AI Image</h3>
        <p>Create images</p>
      </button>

      <button class="tool" onclick="selectTool('Video')">
        <div class="icon">🎬</div>
        <h3>AI Video</h3>
        <p>Create videos</p>
      </button>

      <button class="tool" onclick="selectTool('Voice')">
        <div class="icon">🎤</div>
        <h3>AI Voice</h3>
        <p>Voice tools</p>
      </button>

      <button class="tool" onclick="selectTool('Study')">
        <div class="icon">📚</div>
        <h3>AI Study</h3>
        <p>Learn smarter</p>
      </button>

      <button class="tool" onclick="selectTool('Writer')">
        <div class="icon">✍️</div>
        <h3>AI Writer</h3>
        <p>Write anything</p>
      </button>

    </section>

    <section class="chat">

      <h3>💬 AI Chat</h3>

      <div id="messages">
        <div class="message">
          🤖 Hello! I'm Bablu AI. How can I help you?
        </div>
      </div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="Type your message..."
        >

        <button id="sendBtn" onclick="sendMessage()">
          Send
        </button>
      </div>

    </section>

  </main>

  <footer>
    Bablu AI • Free Demo Version
  </footer>

  <script>

    function selectTool(tool) {
      const messages = document.getElementById("messages");

      messages.innerHTML += `
        <div class="message">
          🤖 ${tool} selected. This feature is available in Demo Mode.
        </div>
      `;

      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");
      const text = input.value.trim();

      if (!text) {
        return;
      }

      messages.innerHTML += `
        <div class="message">
          👤 ${escapeHtml(text)}
        </div>
      `;

      input.value = "";

      const loadingId = "loading-" + Date.now();

      messages.innerHTML += `
        <div class="message" id="${loadingId}">
          🤖 सोच रहा हूँ...
        </div>
      `;

      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        const loading = document.getElementById(loadingId);

        if (loading) {
          loading.remove();
        }

        messages.innerHTML += `
          <div class="message">
            🤖 ${escapeHtml(data.reply || "कोई जवाब नहीं मिला।")}
          </div>
        `;

      } catch (error) {

        const loading = document.getElementById(loadingId);

        if (loading) {
          loading.remove();
        }

        messages.innerHTML += `
          <div class="message">
            🤖 Server से connection नहीं हो पाया।
          </div>
        `;
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });

  </script>

</body>
  </html>
